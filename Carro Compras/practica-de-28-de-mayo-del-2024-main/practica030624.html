<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Demo carro de compras</title>
    <!--son las carpetas de estilo pero desde bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row">
       <!-- se tiene que poner clase para establecer 8 coluumnas -->
       <!-- es importante dejar el main para poder llamarlo en json--> 
       <main id="productos" class="col-sm-8 row">
        </main>
        <aside class=" col-sm-4" >
            <h2>Carrito de compras</h2>
            <ul id="carrito" class="list-group"></ul>
            <!-- el <hr> crea una linea en esa seccion -->
            <hr> 
            <!-- span es cursiva -->   
            <p>Total : $<span id="total"></span></p>
        </aside>
    </div>
</div>
</body>
<script src="producto.json" type="text/javascript"></script>
<script src="conductapractica030628.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
