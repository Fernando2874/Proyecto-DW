<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Demo carro de compras</title>
    <!--son las carpetas de estilo pero desde bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row">
       <!-- se tiene que poner clase para establecer 8 coluumnas -->
        <main id="productos" class="col-sm-8 row">
            <div class="card col-sm-4">
                <div class="card-body0">
                    <h5 class="card-title">Producto 1</h5>
                    <img class="img-fluid" src="images/Neptuno.jpg" alt="imgplaneta01">
                    <p class="card-text">$375.00</p>
                    <!--btn btn-primary esto hace referencia al color -->
                    <button class="btn btn-primary" onclick="agregarcarro1()">+</button>
                </div> 
            </div>
            <div class="card col-sm-4">
                <div class="card-body1">
                    <h5 class="card-title">Producto 2</h5>
                    <img class="img-fluid" src="images/jupiter.webp" alt="imgplaneta02">
                    <p class="card-text">$375.00</p>
                    <button class="btn btn-primary" onclick="agregarcarro2()">+</button>
                </div> 
            </div>
            <div class="card col-sm-4">
                <div class="card-body2">
                    <h5 class="card-title">Producto 3</h5>
                    <img class="img-fluid" src="images/saturno.jpg" alt="imgplaneta03">
                    <p class="card-text">$375.00</p>
                    <button class="btn btn-primary" onclick="agregarcarro3()">+</button>
                </div> 
            </div>
        </main>
        <aside class=" col-sm-4" >
            <h2>Carrito de compras</h2>
            <ul id="carrito" class="list-group"></ul>
            <!-- el <hr> crea una linea en esa seccion -->
            <hr> 
            <!-- span es cursiva -->   
            <p>Total : $<span id="total"></span></p>
        </aside>
    </div>
</div>
</body>
<script src="producto.json" type="text/javascript"></script>
<script src="conductapractica030628.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</html>
